name: Build and Deploy to AKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you trigger manually from GitHub UI

env:
  IMAGE_NAME: my-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. Get the code ----------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- 2. Login to Azure ----------
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------- 3. Login to ACR ----------
      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      # ---------- 4. Set up QEMU (for arm64 emulation) ----------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ---------- 5. Set up Docker Buildx ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 6. Build AND push the image ----------
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # ---------- 7. Get AKS credentials ----------
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER }} \
            --overwrite-existing

      # ---------- 8. Deploy to AKS ----------
      - name: Deploy to AKS
        run: |
          kubectl set image deployment/my-app \
            my-app=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n my-app-ns
          kubectl rollout status deployment/my-app -n my-app-ns --timeout=3m
